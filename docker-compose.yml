# Old and new side by side, sharing one snapshot folder (./snapshots), with a router in front.
# The app only ever talks to the router, so moving it from Elasticsearch to OpenSearch is one config reload.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    environment:
      discovery.type: single-node
      path.repo: /snapshots
      # -XX:-UseContainerSupport: the JDK bundled with 7.10 can't read cgroup v2 limits on modern hosts
      ES_JAVA_OPTS: -Xms512m -Xmx512m -XX:-UseContainerSupport
    volumes: ["./snapshots:/snapshots"]
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      timeout: 5s
      retries: 40

  opensearch:
    image: opensearchproject/opensearch:2.19.7
    environment:
      discovery.type: single-node
      path.repo: /snapshots
      reindex.remote.allowlist: elasticsearch:9200   # lets OpenSearch pull catch-up writes from Elasticsearch
      DISABLE_SECURITY_PLUGIN: "true"                # local demo only
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["./snapshots:/snapshots"]
    ports: ["9201:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      timeout: 5s
      retries: 40

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.7
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }

  router:
    image: nginx:1.30.7-alpine
    volumes: ["./router:/etc/nginx/conf.d"]
    ports: ["8080:80"]
    depends_on:
      elasticsearch: { condition: service_healthy }

