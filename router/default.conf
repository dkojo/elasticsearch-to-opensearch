# The app's only way in. scripts/migrate.sh switch rewrites the "server" line to opensearch:9200 and reloads nginx.
# A reload starts new workers and lets the old ones finish their requests, so nothing in flight is dropped.
upstream search {
    server elasticsearch:9200;
}

server {
    listen 80;
    location / {
        proxy_pass http://search;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
